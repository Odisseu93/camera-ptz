<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Camera PTZ</title>
  <link rel="stylesheet" href="/static/css/controls.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #stream-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      overflow: hidden;
    }
    #camera-feed {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div id="stream-container">
    <img id="camera-feed" src="/api/stream" alt="Camera Stream" />

    <!-- Left Joystick: Pan & Tilt -->
    <div id="joystick-left-zone" class="joystick-zone">
      <span class="joystick-label">Pan / Tilt</span>
    </div>

    <!-- Right Joystick: Zoom / Fine Tilt -->
    <div id="joystick-right-zone" class="joystick-zone">
      <span class="joystick-label">Ajuste</span>
    </div>
  </div>

  <script src="https://unpkg.com/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
  <script src="/static/js/controls.js"></script>
</body>
</html>
