<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0f14">
  <title>Camera PTZ</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/controls.css">
</head>
<body>
  <div id="app-container">
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-brand">
        <div id="status-indicator" class="status-dot" title="Status da Conexão"></div>
        <span>Camera PTZ</span>
      </div>
      <div class="nav-actions">
        <!-- Fullscreen -->
        <button id="btn-fullscreen" class="icon-btn" title="Tela Cheia">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <!-- Reconnect -->
        <button id="btn-restart" class="icon-btn" title="Reiniciar Conexão">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <!-- Settings Drawer Toggle -->
        <button id="btn-toggle-settings" class="icon-btn" title="Configurações">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </header>

    <!-- Side Settings Drawer -->
    <aside id="settings-panel" class="settings-drawer">
      <div class="drawer-header">
        <h2 class="drawer-title">Configurações</h2>
      </div>

      <div class="setting-group">
        <label for="select-resolution" class="setting-label">Resolução do Stream</label>
        <select id="select-resolution" class="setting-select"></select>
      </div>

      <div class="setting-group">
        <span class="setting-label">Dispositivo Host</span>
        <div class="info-badge">
          Hardware: Intel Core i5 (Low-RAM Mode)<br>
          Codec: MJPEG / RTSP UDP
        </div>
      </div>

      <div class="setting-group" style="margin-top: auto;">
        <button id="btn-logout" class="icon-btn" style="width: 100%; height: 42px; gap: 8px; font-weight: 500;" title="Sair da Conta">
          <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          Sair
        </button>
      </div>
    </aside>

    <!-- Video Stream Viewport -->
    <main id="stream-container">
      <img id="camera-feed" src="/api/stream" alt="Camera Stream" />

      <!-- Left Joystick: Pan & Tilt -->
      <div id="joystick-left-zone" class="joystick-zone">
        <span class="joystick-label">Pan / Tilt</span>
      </div>

      <!-- Right Joystick: Fine Adjust / Vertical -->
      <div id="joystick-right-zone" class="joystick-zone">
        <span class="joystick-label">Ajuste</span>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
  <script src="/static/js/controls.js"></script>
  <script src="/static/js/settings.js"></script>
</body>
</html>
